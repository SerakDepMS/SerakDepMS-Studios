<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 | SerakDepMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .not-found-page { min-height: 100vh; display: grid; place-items: center; padding: 30px 8%; background: var(--bg-main); }
        .not-found-card { width: min(100%, 620px); padding: clamp(32px, 6vw, 64px); text-align: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
        .not-found-code { color: var(--primary-color); font-family: var(--font-code); font-size: clamp(4rem, 14vw, 8rem); line-height: 1; margin-bottom: 20px; text-shadow: 0 0 24px var(--primary-glow); }
        .not-found-card h1 { margin-bottom: 14px; font-size: clamp(1.6rem, 4vw, 2.4rem); }
        .not-found-card p { max-width: 440px; margin: 0 auto 30px; color: var(--text-muted); }
        .not-found-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
    </style>
</head>
<body>
    <main class="not-found-page">
        <section class="not-found-card" aria-labelledby="not-found-title">
            <div class="not-found-code" aria-hidden="true">404</div>
            <h1 id="not-found-title">Signal not found</h1>
            <p>This route is outside the current digital ecosystem. Return to the main system or inspect the deployed operations.</p>
            <div class="not-found-actions">
                <a class="btn btn-primary" href="index.html"><i class="fa-solid fa-house" aria-hidden="true"></i> Return home</a>
                <a class="btn btn-outline" href="index.html#projects"><i class="fa-solid fa-folder-open" aria-hidden="true"></i> View operations</a>
            </div>
        </section>
    </main>
</body>
</html>
